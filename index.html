<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>通勤簿記3級｜2級への最短コース</title>
<style>
:root{--bg:#f4f4ef;--panel:#fff;--text:#20231f;--muted:#6d7469;--line:#dde1d8;--accent:#324b3b;--soft:#e7eee8;--good:#2f6e43;--bad:#9a4742;--warn:#7b6027}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.75}
button{font:inherit}.app{max-width:1120px;margin:auto;padding:16px}.hero{padding:25px 4px 16px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--muted)}h1{font-size:clamp(29px,7vw,54px);line-height:1.08;margin:8px 0}.hero p{color:var(--muted);font-size:16px;max-width:720px}
.topActions{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;min-height:44px;padding:10px 15px;font-weight:800;cursor:pointer}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.ghost{background:transparent}
.progressShell{height:9px;background:#e1e4dd;border-radius:99px;overflow:hidden}.progress{height:100%;background:var(--accent);width:0;transition:.25s}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:11px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}
.layout{display:grid;grid-template-columns:225px minmax(0,1fr);gap:22px}.nav{align-self:start;position:sticky;top:8px;max-height:90vh;overflow:auto;padding-right:4px}.nav button{width:100%;border:0;background:transparent;text-align:left;min-height:42px;padding:9px 10px;border-radius:10px;color:inherit;cursor:pointer;font-size:13px}.nav button.active{background:var(--soft);font-weight:850}.nav button.done::after{content:" ✓";color:var(--good)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,28px);margin:0 0 16px}.lesson h2{font-size:clamp(25px,5vw,38px);line-height:1.2;margin:0 0 6px}.lesson .meta{color:var(--muted);font-size:13px;margin-bottom:18px}.lesson h3{margin-top:25px}.memory{border-left:5px solid var(--accent);background:var(--soft);padding:13px 15px;border-radius:0 12px 12px 0;margin:18px 0}.example{padding:14px 16px;border:1px dashed #abb4a7;background:#fafbf8;border-radius:13px;margin:13px 0}.formula{text-align:center;font-weight:900;font-size:clamp(18px,4vw,26px);padding:16px;margin:14px 0;background:#f0f2ed;border-radius:14px}.concept{display:flex;align-items:stretch;gap:7px;flex-wrap:wrap;margin:18px 0}.conceptBox{flex:1;min-width:120px;border:1px solid var(--line);border-radius:14px;padding:15px;text-align:center}.conceptBox b{display:block;font-size:17px}.conceptBox span{font-size:12px;color:var(--muted)}.flow{align-self:center;font-size:23px;color:var(--muted)}
.fiveGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.fiveGrid div,.three div,.four div,.pairs div,.compare div{border:1px solid var(--line);border-radius:13px;padding:14px;background:#fafbf8}.fiveGrid b,.three b,.four b,.pairs b,.compare b{display:block}.fiveGrid span,.three span,.four span,.pairs span,.compare span{font-size:12px;color:var(--muted)}.compare em{display:block;font-style:normal;font-weight:800;margin-top:5px}
.taccount{display:grid;grid-template-columns:1fr 1fr;border-top:3px solid var(--text);margin:20px 0}.taccount>div{padding:14px;min-height:130px;text-align:center}.taccount>div:first-child{border-right:3px solid var(--text)}.taccount h4{margin:0 0 12px}.taccount small{display:block;color:var(--muted)}
.journal{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:13px 0}.journal div{padding:12px}.journal div:nth-child(odd){border-right:1px solid var(--line)}.journal .head{background:#eef0eb;text-align:center;font-weight:850}.steps{padding-left:24px}.steps li{margin:9px 0}.compare,.three,.four,.pairs{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:14px 0}.three{grid-template-columns:repeat(3,1fr)}.four{grid-template-columns:repeat(2,1fr)}.pairs{grid-template-columns:1fr}.route{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.route span,.route b{padding:12px;border-radius:11px;background:#f0f2ed}
.chapterActions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:18px 0}.quizCard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin:16px 0}.qnum{font-size:12px;color:var(--muted);font-weight:800}.qtext{font-size:18px;font-weight:800}.options{display:grid;gap:9px;margin-top:14px}.options button{min-height:46px;text-align:left;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);cursor:pointer}.options button.good{outline:2px solid var(--good);background:#edf7ef}.options button.bad{outline:2px solid var(--bad);background:#faefee}.explain{margin-top:12px;font-size:14px;font-weight:700}.commuteHeader{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.scoreBig{font-size:40px;font-weight:900}.hidden{display:none!important}.screen{display:none}.screen.active{display:block}
.banner{padding:13px 15px;background:#fff8e6;border:1px solid #e6d5a4;color:#574719;border-radius:13px;font-size:13px;margin-bottom:14px}.footer{text-align:center;color:var(--muted);font-size:12px;padding:32px 0 55px}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.nav{position:static;display:flex;overflow-x:auto;max-height:none;padding-bottom:5px}.nav button{min-width:max-content;width:auto}.fiveGrid{grid-template-columns:repeat(2,1fr)}.fiveGrid div:last-child{grid-column:1/-1}.three{grid-template-columns:1fr}.compare{grid-template-columns:1fr}.concept{display:grid;grid-template-columns:1fr}.flow{transform:rotate(90deg);justify-self:center}.chapterActions .btn{flex:1}.route{grid-template-columns:1fr}}
@media(prefers-color-scheme:dark){:root{--bg:#111310;--panel:#1b1e19;--text:#f0f2ec;--muted:#a7ada1;--line:#373c34;--accent:#abc5ae;--soft:#263128}.btn.primary{color:#132018}.progressShell{background:#2b3028}.fiveGrid div,.three div,.four div,.pairs div,.compare div,.example{background:#20241e}.formula,.route span,.route b,.journal .head{background:#292e27}.options button{background:#20241e}.options button.good{background:#1f3526}.options button.bad{background:#3a2624}.banner{background:#302b1e;border-color:#554b2e;color:#e7d9ac}}
</style>
</head>
<body>
<div class="app">
<header class="hero">
<div class="eyebrow">COMMUTE BOOKKEEPING · NISSHO 3</div>
<h1>通勤簿記3級<br>2級への最短コース</h1>
<p>ゼロから3級全範囲を理解し、2級へ接続するための通勤教材。1章8〜14分。学習状況はこの端末のブラウザに自動保存されます。</p>
<div class="topActions"><button class="btn primary" id="todayBtn">▶ 今日の10分</button><button class="btn" id="courseBtn">教科書を開く</button><button class="btn" id="drillBtn">ランダム10問</button></div>
<div class="progressShell"><div class="progress" id="progress"></div></div>
<div class="stats"><div class="stat"><b id="doneCount">0/0</b><span>修了章</span></div><div class="stat"><b id="correctRate">—</b><span>問題正答率</span></div><div class="stat"><b id="streak">0日</b><span>学習日数</span></div><div class="stat"><b id="nextLesson">01</b><span>次の章</span></div></div>
</header>

<section id="courseScreen" class="screen active">
<div class="layout"><nav class="nav" id="nav"></nav><main id="lessonHost"></main></div>
</section>

<section id="drillScreen" class="screen">
<div class="panel">
<div class="commuteHeader"><div><div class="eyebrow">COMMUTE DRILL</div><h2 id="drillTitle">今日の10分</h2></div><button class="btn" id="backCourse">教科書へ</button></div>
<p id="drillLead">10問だけ。迷ったら「分類 → 増減 → 左右」に戻る。</p>
<div id="drillHost"></div>
<div id="drillResult" class="hidden"></div>
</div>
</section>

<footer class="footer">2026年度の日商簿記3級出題区分をベースにした学習用教材。公式問題の転載ではなく、独自の説明・練習問題です。</footer>
</div>

<script>
const DATA = {"chapters": [{"title": "簿記の全体像", "time": "8分", "summary": "会社の出来事を「2つの側面」で記録する仕組みを理解する。", "body": "\n<div class=\"concept\">\n  <div class=\"conceptBox\"><b>取引</b><span>商品を売る、家賃を払う、借金する…</span></div>\n  <div class=\"flow\">→</div>\n  <div class=\"conceptBox\"><b>仕訳</b><span>簿記の言葉へ翻訳</span></div>\n  <div class=\"flow\">→</div>\n  <div class=\"conceptBox\"><b>帳簿</b><span>科目ごとに集計</span></div>\n  <div class=\"flow\">→</div>\n  <div class=\"conceptBox\"><b>財務諸表</b><span>成績と財産を表示</span></div>\n</div>\n<p>簿記は単なる家計簿ではありません。1つの取引を必ず<strong>原因と結果の2方向</strong>から記録します。</p>\n<div class=\"example\"><b>例：自分のお金100万円で会社を始めた</b><br>会社には「現金100万円が増えた」と同時に、「出資者からの元手100万円が増えた」が起こります。</div>\n<div class=\"memory\"><b>ゴール：</b>取引 → 仕訳 → 転記 → 試算表 → 決算整理 → P/L・B/S、という一本の流れを頭に作る。</div>\n"}, {"title": "5要素と借方・貸方", "time": "10分", "summary": "資産・負債・純資産・収益・費用と、左右のルール。", "body": "\n<div class=\"fiveGrid\">\n <div><b>資産</b><span>現金、預金、売掛金、備品</span></div>\n <div><b>負債</b><span>買掛金、借入金、未払金</span></div>\n <div><b>純資産</b><span>資本金、繰越利益剰余金</span></div>\n <div><b>収益</b><span>売上、受取利息</span></div>\n <div><b>費用</b><span>仕入、給料、家賃</span></div>\n</div>\n<div class=\"taccount\">\n <div><h4>借方（左）で増える</h4><b>資産・費用</b><small>減るときは右</small></div>\n <div><h4>貸方（右）で増える</h4><b>負債・純資産・収益</b><small>減るときは左</small></div>\n</div>\n<div class=\"formula\">資産 ＝ 負債 ＋ 純資産</div>\n<div class=\"formula\">利益 ＝ 収益 − 費用</div>\n<div class=\"memory\"><b>覚え方より先に分類。</b>「何の科目？→増えた？減った？→左右どちら？」の順で考える。</div>\n"}, {"title": "仕訳の作り方", "time": "10分", "summary": "文章を4ステップで仕訳へ変換する。", "body": "\n<ol class=\"steps\"><li><b>何が動いた？</b> 2つ以上の要素を拾う</li><li><b>5要素のどれ？</b></li><li><b>増えた？減った？</b></li><li><b>左（借方）か右（貸方）か決める</b></li></ol>\n<div class=\"example\"><b>商品30,000円を現金で販売</b><br>現金：資産↑ → 左<br>売上：収益↑ → 右</div>\n<div class=\"journal\"><div class=\"head\">借方</div><div class=\"head\">貸方</div><div>現金 30,000</div><div>売上 30,000</div></div>\n<p>左右の合計額は必ず一致します。これを<strong>貸借平均の原理</strong>といいます。</p>\n<div class=\"memory\">仕訳は「暗記カード」ではなく、取引を構造化する作業。</div>\n"}, {"title": "現金・預金・小口現金", "time": "12分", "summary": "現金、預金、現金過不足、小口現金を処理する。", "body": "\n<p><strong>現金</strong>には紙幣・硬貨だけでなく、すぐ現金化できる一部の証票も含まれます。普通預金・当座預金などは預金科目で管理します。</p>\n<div class=\"example\"><b>普通預金から現金50,000円を引き出した</b><br>現金 50,000 / 普通預金 50,000</div>\n<h3>現金過不足</h3><p>帳簿残高と実際の現金が違ったら、一時的に<strong>現金過不足</strong>で処理します。</p>\n<div class=\"example\"><b>帳簿より現金が2,000円少ない</b><br>現金過不足 2,000 / 現金 2,000</div>\n<h3>小口現金</h3><p>日々の少額支払用に担当者へ一定額を渡す仕組み。定額資金前渡法では、使った分だけ補給します。</p>\n<div class=\"memory\">「現金そのもの」と「銀行預金」は別の資産。現金過不足は原因判明までの仮置き。</div>\n"}, {"title": "商品売買① 3分法", "time": "12分", "summary": "仕入・売上・繰越商品による3分法を理解する。", "body": "\n<p>3級の商品売買の中心は<strong>3分法</strong>です。商品を「仕入」「売上」「繰越商品」の3科目で扱います。</p>\n<div class=\"example\"><b>商品80,000円を現金で仕入</b><br>仕入 80,000 / 現金 80,000</div>\n<div class=\"example\"><b>商品120,000円を掛けで販売</b><br>売掛金 120,000 / 売上 120,000</div>\n<h3>返品</h3><p>仕入返品は仕入を取り消す。売上返品は売上を取り消す。</p>\n<div class=\"example\">買った商品10,000円を返品：買掛金 10,000 / 仕入 10,000</div>\n<div class=\"memory\">3分法では、販売のたびに商品の原価を仕訳しない。売上原価は決算でまとめて計算する。</div>\n"}, {"title": "商品売買② 売掛金・買掛金", "time": "10分", "summary": "掛取引と商品以外の後払いを区別する。", "body": "\n<div class=\"compare\">\n <div><b>売掛金</b><span>商品を売ったが未回収</span><em>資産</em></div>\n <div><b>買掛金</b><span>商品を買ったが未払い</span><em>負債</em></div>\n</div>\n<div class=\"example\">商品50,000円を掛売り：売掛金 50,000 / 売上 50,000</div>\n<div class=\"example\">掛代金を預金で回収：普通預金 50,000 / 売掛金 50,000</div>\n<h3>商品以外なら？</h3>\n<div class=\"compare\"><div><b>未収入金</b><span>商品以外を売って未回収</span></div><div><b>未払金</b><span>商品以外を買って未払い</span></div></div>\n<div class=\"example\">備品100,000円を後払いで購入：備品 100,000 / 未払金 100,000</div>\n<div class=\"memory\">「掛」の名前を使うのは原則として営業上の商品売買。備品なら未払金。</div>\n"}, {"title": "その他の債権・債務", "time": "12分", "summary": "貸付・借入、前払・前受、立替・預り、仮払・仮受など。", "body": "\n<div class=\"pairs\">\n <div><b>貸付金 ↔ 借入金</b><span>貸した側は資産／借りた側は負債</span></div>\n <div><b>前払金 ↔ 前受金</b><span>商品引渡し前の手付金など</span></div>\n <div><b>立替金 ↔ 預り金</b><span>他人分を一時立替／他人分を一時預る</span></div>\n <div><b>仮払金 ↔ 仮受金</b><span>内容・金額などが未確定</span></div>\n</div>\n<div class=\"example\"><b>社員の出張前に30,000円を概算で渡した</b><br>仮払金 30,000 / 現金 30,000</div>\n<div class=\"example\"><b>社員負担の社会保険料を給料から預かった</b><br>給料 XXX / 預り金 XXX（ほか支給・控除も合わせて仕訳）</div>\n<h3>受取商品券</h3><p>他社発行の商品券等を受け取った場合、将来換金できる権利として資産で処理します。</p>\n<div class=\"memory\">意味を日本語に戻す。「将来もらえる権利＝資産」「将来渡す義務＝負債」。</div>\n"}, {"title": "手形・電子記録債権", "time": "12分", "summary": "受取手形・支払手形と電子記録債権債務の基本。", "body": "\n<div class=\"compare\">\n <div><b>受取手形</b><span>将来代金を受け取る権利</span><em>資産</em></div>\n <div><b>支払手形</b><span>将来代金を支払う義務</span><em>負債</em></div>\n</div>\n<div class=\"example\">売掛金80,000円について手形を受け取った：受取手形 80,000 / 売掛金 80,000</div>\n<div class=\"example\">買掛金60,000円について手形を振り出した：買掛金 60,000 / 支払手形 60,000</div>\n<h3>電子記録債権・債務</h3><p>紙の手形に似た信用取引を電子記録で管理するもの。発生時には売掛金・買掛金などから振り替えます。</p>\n<div class=\"example\">売掛金を電子記録債権へ：電子記録債権 / 売掛金</div>\n<div class=\"memory\">名称が違っても本質は「もらえる権利」と「払う義務」。</div>\n"}, {"title": "クレジット売掛金・貸倒れ", "time": "12分", "summary": "カード販売と貸倒引当金を理解する。", "body": "\n<h3>クレジット売掛金</h3><p>カード会社等から後日入金される販売。販売時点で手数料が明らかな場合は手数料も処理します。</p>\n<div class=\"example\"><b>10,000円の商品をカード販売。手数料300円</b><br>クレジット売掛金 9,700 / 売上 10,000<br>支払手数料 300</div>\n<h3>貸倒れ</h3><p>売掛金などが回収不能になること。決算時には将来の貸倒れを見積もって<strong>貸倒引当金</strong>を設定します。</p>\n<div class=\"formula\">貸倒見積額 ＝ 債権残高 × 設定率</div>\n<div class=\"example\">売掛金100,000円、2%を見積：貸倒引当金繰入 2,000 / 貸倒引当金 2,000</div>\n<div class=\"memory\">貸倒引当金は「今すでに貸倒れた」ではなく、将来の損失を見積もる決算整理。</div>\n"}, {"title": "商品有高帳・帳簿", "time": "12分", "summary": "主要簿、補助簿、商品有高帳の役割をつかむ。", "body": "\n<div class=\"concept\">\n <div class=\"conceptBox\"><b>仕訳帳</b><span>取引を日付順</span></div><div class=\"flow\">→</div>\n <div class=\"conceptBox\"><b>総勘定元帳</b><span>勘定科目別</span></div>\n</div>\n<p>この2つが<strong>主要簿</strong>。現金出納帳、売掛金元帳、買掛金元帳、仕入帳、売上帳、商品有高帳などは補助簿です。</p>\n<h3>商品有高帳</h3><p>商品の数量・単価・金額を管理します。3級では<strong>先入先出法</strong>と<strong>移動平均法</strong>が重要。</p>\n<div class=\"compare\"><div><b>先入先出法</b><span>先に仕入れた商品から先に払い出すと仮定</span></div><div><b>移動平均法</b><span>仕入れるたび平均単価を再計算</span></div></div>\n<div class=\"memory\">試験では「どの補助簿に記入されるか」も問われる。取引から帳簿を逆算できるようにする。</div>\n"}, {"title": "証ひょう・伝票", "time": "8分", "summary": "領収書などの証ひょうと3伝票制。", "body": "\n<p><strong>証ひょう</strong>は取引の事実を裏づける資料。領収書、請求書、納品書などです。</p>\n<h3>3伝票制</h3>\n<div class=\"three\">\n <div><b>入金伝票</b><span>現金が入る取引</span></div>\n <div><b>出金伝票</b><span>現金が出る取引</span></div>\n <div><b>振替伝票</b><span>現金の入出金以外</span></div>\n</div>\n<div class=\"example\">売掛金30,000円を現金回収 → 入金伝票</div>\n<div class=\"example\">商品を掛けで仕入 → 振替伝票</div>\n<div class=\"memory\">「現金」が増えるなら入金、減るなら出金、現金が動かなければ振替。</div>\n"}, {"title": "固定資産と減価償却", "time": "14分", "summary": "備品などの取得・売却・減価償却。", "body": "\n<p>長期間使用する建物・備品・車両運搬具・土地などを<strong>有形固定資産</strong>といいます。取得に必要な付随費用も原則取得原価に含めます。</p>\n<div class=\"example\">備品200,000円、運送費10,000円を現金払い：備品 210,000 / 現金 210,000</div>\n<h3>減価償却</h3><p>土地以外の固定資産は、使用期間にわたって取得原価を費用配分します。3級では<strong>定額法・間接法</strong>が中心。</p>\n<div class=\"formula\">年間減価償却費 ＝（取得原価 − 残存価額）÷ 耐用年数</div>\n<div class=\"journal\"><div class=\"head\">借方</div><div class=\"head\">貸方</div><div>減価償却費</div><div>減価償却累計額</div></div>\n<h3>売却</h3><p>売却時は取得原価と累計額を消し、帳簿価額と売却額の差を固定資産売却益・損で処理。</p>\n<div class=\"memory\">減価償却累計額は資産のマイナス評価勘定。現金が出ていく仕訳ではない。</div>\n"}, {"title": "収益・費用・税金", "time": "12分", "summary": "代表的な費用科目、法人税等、消費税。", "body": "\n<p>代表的な費用には給料、法定福利費、広告宣伝費、旅費交通費、通信費、消耗品費、水道光熱費、支払家賃、租税公課、支払利息などがあります。</p>\n<h3>消費税（税抜方式）</h3>\n<div class=\"compare\"><div><b>仮払消費税</b><span>仕入・経費で支払った消費税</span><em>資産</em></div><div><b>仮受消費税</b><span>売上で預かった消費税</span><em>負債</em></div></div>\n<div class=\"example\">税抜10,000円の商品を現金仕入、消費税10%：仕入 10,000 / 現金 11,000<br>仮払消費税 1,000</div>\n<h3>法人税、住民税及び事業税</h3><p>決算で当期負担額を費用計上し、未払い分は未払法人税等。</p>\n<div class=\"memory\">固定資産税などは租税公課。法人税等は専用科目。消費税は税抜方式の流れを理解。</div>\n"}, {"title": "決算① 売上原価・消耗品", "time": "14分", "summary": "期末商品棚卸と売上原価、消耗品の決算整理。", "body": "\n<p>決算では「今年の利益」を正しくするため、日常仕訳を修正します。</p>\n<h3>売上原価</h3>\n<div class=\"formula\">売上原価 ＝ 期首商品 ＋ 当期仕入 − 期末商品</div>\n<p>3分法では、期末に繰越商品と仕入を使って売上原価を計算します。</p>\n<div class=\"example\"><b>期首商品30,000円、期末商品40,000円</b><br>仕入 30,000 / 繰越商品 30,000<br>繰越商品 40,000 / 仕入 40,000</div>\n<h3>消耗品</h3><p>購入時に消耗品費で処理していて未使用分が残ったら、その分を資産の消耗品へ振り替えます。</p>\n<div class=\"example\">未使用3,000円：消耗品 3,000 / 消耗品費 3,000</div>\n<div class=\"memory\">決算整理は「期末時点で、資産・負債・収益・費用を正しい期間に直す」作業。</div>\n"}, {"title": "決算② 前払・前受・未収・未払", "time": "14分", "summary": "経過勘定で期間帰属を正しくする。", "body": "\n<p>現金の受払時点ではなく、<strong>その収益・費用がいつ発生したか</strong>で考えます。</p>\n<div class=\"four\">\n <div><b>前払費用</b><span>払ったが翌期分 → 資産</span></div>\n <div><b>前受収益</b><span>受け取ったが翌期分 → 負債</span></div>\n <div><b>未収収益</b><span>当期分だが未回収 → 資産</span></div>\n <div><b>未払費用</b><span>当期分だが未払い → 負債</span></div>\n</div>\n<div class=\"example\">翌期分家賃20,000円が当期費用に入っている：前払費用 20,000 / 支払家賃 20,000</div>\n<div class=\"example\">当期分利息5,000円が未回収：未収収益 5,000 / 受取利息 5,000</div>\n<div class=\"memory\">「お金はもう動いた？」「今年の分？」の2問で4つを分類する。</div>\n"}, {"title": "決算③ 試算表・精算表", "time": "14分", "summary": "決算整理前から財務諸表までの流れ。", "body": "\n<div class=\"concept\">\n <div class=\"conceptBox\"><b>試算表</b><span>決算前残高</span></div><div class=\"flow\">→</div>\n <div class=\"conceptBox\"><b>決算整理</b><span>棚卸・減価償却等</span></div><div class=\"flow\">→</div>\n <div class=\"conceptBox\"><b>整理後残高</b><span>正しい残高</span></div>\n</div>\n<p><strong>8桁精算表</strong>は、試算表・修正記入・損益計算書・貸借対照表の欄を使って決算を一枚で整理します。</p>\n<div class=\"route\">\n <span>収益・費用</span><b>→ P/L（損益計算書）</b>\n <span>資産・負債・純資産</span><b>→ B/S（貸借対照表）</b>\n</div>\n<div class=\"memory\">精算表ではまず決算整理仕訳を頭の中で作る。その後に各欄へ数字を移す。</div>\n"}, {"title": "決算④ P/L・B/Sと締切", "time": "12分", "summary": "利益が純資産へつながる仕組みを理解する。", "body": "\n<div class=\"compare\">\n <div><b>P/L 損益計算書</b><span>一定期間の経営成績</span><em>収益 − 費用 = 利益</em></div>\n <div><b>B/S 貸借対照表</b><span>期末時点の財政状態</span><em>資産 = 負債 + 純資産</em></div>\n</div>\n<p>収益と費用は損益勘定へ振り替え、最終的な利益は<strong>繰越利益剰余金</strong>へつながります。</p>\n<div class=\"concept\">\n <div class=\"conceptBox\"><b>当期純利益</b></div><div class=\"flow\">→</div><div class=\"conceptBox\"><b>純資産が増える</b></div>\n</div>\n<p>帳簿を締め切り、翌期へ繰り越す資産・負債・純資産を確定します。</p>\n<div class=\"memory\">P/LとB/Sは別々の表ではなく、利益を通じてつながっている。</div>\n"}, {"title": "株式会社の基礎", "time": "10分", "summary": "設立時の資本金と繰越利益剰余金を押さえる。", "body": "\n<p>株式会社では、株主から払い込まれた資金をもとに事業を始めます。3級では株式会社の基本的な資本取引を扱います。</p>\n<div class=\"example\"><b>会社設立時、株式発行により現金1,000,000円の払込みを受けた</b><br>現金 1,000,000 / 資本金 1,000,000</div>\n<h3>繰越利益剰余金</h3><p>過去から蓄積した利益のうち、会社内に残っている部分。決算の当期純利益も最終的にここへ振り替えられます。</p>\n<div class=\"memory\">資本金は「売上」ではない。株主からの出資なので収益ではなく純資産。</div>\n"}, {"title": "本試験の解き方", "time": "10分", "summary": "第1問〜第3問を時間内に処理する戦略。", "body": "\n<p>日商簿記3級は現在、公式サンプルでも<strong>第1問・第2問(1)(2)・第3問</strong>の構成です。実戦では「分かる問題を確実に取る」ことが重要です。</p>\n<div class=\"three\">\n <div><b>第1問</b><span>仕訳。最重要得点源</span></div>\n <div><b>第2問</b><span>帳簿・勘定・理論など</span></div>\n <div><b>第3問</b><span>決算・財務諸表系</span></div>\n</div>\n<ol class=\"steps\"><li>仕訳は「科目→増減→左右」で機械的に</li><li>難問に固執しない</li><li>決算整理は必ず仕訳を作ってから表へ</li><li>最後に借貸の一致と転記漏れを確認</li></ol>\n<div class=\"memory\"><b>2級への接続条件：</b>基本仕訳がほぼ反射で切れ、決算整理→P/L/B/Sの流れを説明できたら3級学習を長引かせない。</div>\n"}], "questions": [{"q": "現金が増加した。借方・貸方どちら？", "opts": ["借方", "貸方"], "a": 0, "why": "現金は資産。資産の増加は借方。"}, {"q": "銀行から100,000円を借り普通預金に入金された。正しい仕訳は？", "opts": ["普通預金 100,000 / 借入金 100,000", "借入金 100,000 / 普通預金 100,000", "普通預金 100,000 / 売上 100,000"], "a": 0, "why": "普通預金という資産↑、借入金という負債↑。"}, {"q": "商品50,000円を掛けで販売した。", "opts": ["売掛金 50,000 / 売上 50,000", "未収入金 50,000 / 売上 50,000", "売上 50,000 / 売掛金 50,000"], "a": 0, "why": "商品の掛売りなので売掛金。"}, {"q": "備品80,000円を後払いで購入した。", "opts": ["備品 80,000 / 買掛金 80,000", "備品 80,000 / 未払金 80,000", "未払金 80,000 / 備品 80,000"], "a": 1, "why": "商品以外の後払いは未払金。"}, {"q": "商品30,000円を掛けで仕入れた。", "opts": ["仕入 30,000 / 買掛金 30,000", "買掛金 30,000 / 仕入 30,000", "仕入 30,000 / 未払金 30,000"], "a": 0, "why": "商品の掛仕入なので買掛金。"}, {"q": "売掛金20,000円を現金で回収した。", "opts": ["現金 20,000 / 売掛金 20,000", "売掛金 20,000 / 現金 20,000", "現金 20,000 / 売上 20,000"], "a": 0, "why": "売上は販売時に計上済み。回収時は債権を減らす。"}, {"q": "出張前に社員へ概算30,000円を渡した。", "opts": ["旅費交通費 / 現金", "仮払金 / 現金", "立替金 / 現金"], "a": 1, "why": "用途・金額が確定するまでは仮払金。"}, {"q": "帳簿の現金より実際現金が1,000円少なかった。原因不明。", "opts": ["現金 / 現金過不足", "現金過不足 / 現金", "雑損 / 現金"], "a": 1, "why": "原因不明時はいったん現金過不足。"}, {"q": "資産に該当するものは？", "opts": ["買掛金", "前受金", "未収入金", "資本金"], "a": 2, "why": "未収入金は将来回収する権利。"}, {"q": "負債に該当するものは？", "opts": ["前払金", "貸付金", "預り金", "受取手形"], "a": 2, "why": "預り金は後に第三者等へ渡す義務。"}, {"q": "商品を現金で仕入れたとき3分法で使う科目は？", "opts": ["商品", "仕入", "売上原価"], "a": 1, "why": "3分法の日常仕訳では仕入を使う。"}, {"q": "売上返品が発生した。3分法ではどうする？", "opts": ["売上を減らす", "仕入を増やす", "売掛金を必ず増やす"], "a": 0, "why": "売上の取消しとして処理。"}, {"q": "受取手形は何に分類される？", "opts": ["資産", "負債", "収益", "純資産"], "a": 0, "why": "将来受け取る権利なので資産。"}, {"q": "支払手形は何に分類される？", "opts": ["資産", "負債", "費用", "純資産"], "a": 1, "why": "将来支払う義務なので負債。"}, {"q": "貸倒引当金を設定する目的は？", "opts": ["将来の貸倒損失を見積もる", "現金残高を増やす", "売上を増やす"], "a": 0, "why": "将来の回収不能リスクを決算で見積もる。"}, {"q": "貸倒見積対象100,000円、設定率2%。必要額は？", "opts": ["1,000円", "2,000円", "5,000円"], "a": 1, "why": "100,000×2%=2,000。"}, {"q": "固定資産の取得原価に通常含めるものは？", "opts": ["取得に直接必要な付随費用", "翌年の電気代", "将来の売上"], "a": 0, "why": "運送費・据付費など取得に必要な付随費用を含める。"}, {"q": "減価償却費は何に分類される？", "opts": ["資産", "負債", "費用", "収益"], "a": 2, "why": "固定資産の取得原価を期間配分した費用。"}, {"q": "定額法で取得原価500,000円、残存価額0、耐用年数5年。年額は？", "opts": ["50,000円", "100,000円", "250,000円"], "a": 1, "why": "500,000÷5=100,000。"}, {"q": "仮払消費税は何に分類される？", "opts": ["資産", "負債", "収益"], "a": 0, "why": "税抜方式では支払った消費税を一時的に資産処理。"}, {"q": "仮受消費税は何に分類される？", "opts": ["資産", "負債", "費用"], "a": 1, "why": "預かった消費税なので納付まで負債。"}, {"q": "翌期分の家賃を当期に支払済み。決算で使う科目は？", "opts": ["未払費用", "前払費用", "前受収益"], "a": 1, "why": "支払済みだが翌期分なので資産の前払費用。"}, {"q": "当期分の利息がまだ未回収。", "opts": ["未収収益", "前受収益", "未収入金"], "a": 0, "why": "収益の期間帰属調整なので未収収益。"}, {"q": "当期分の電気代がまだ未払い。", "opts": ["未払金", "未払費用", "前払費用"], "a": 1, "why": "費用の期間帰属調整なので未払費用。"}, {"q": "翌期分の家賃収入を先に受け取った。", "opts": ["前受金", "前受収益", "仮受金"], "a": 1, "why": "収益の期間帰属調整なので前受収益。"}, {"q": "売上原価の基本式は？", "opts": ["期首商品+仕入−期末商品", "期末商品+仕入−期首商品", "売上−仕入"], "a": 0, "why": "期首在庫＋当期仕入−期末在庫。"}, {"q": "収益と費用は最終的にどの表へ？", "opts": ["貸借対照表", "損益計算書", "商品有高帳"], "a": 1, "why": "収益・費用から当期利益を計算するP/Lへ。"}, {"q": "資産・負債・純資産は最終的にどの表へ？", "opts": ["貸借対照表", "損益計算書", "仕訳帳"], "a": 0, "why": "期末の財政状態を示すB/Sへ。"}, {"q": "会社設立時の株主からの払込みは通常どの科目？", "opts": ["売上", "資本金", "借入金"], "a": 1, "why": "出資は収益ではなく純資産。"}, {"q": "仕訳帳と総勘定元帳をまとめて何という？", "opts": ["補助簿", "主要簿", "伝票"], "a": 1, "why": "仕訳帳と総勘定元帳が主要簿。"}, {"q": "現金が入る取引を3伝票制で記録するのは？", "opts": ["入金伝票", "出金伝票", "振替伝票"], "a": 0, "why": "現金増加は入金伝票。"}, {"q": "掛仕入を3伝票制で記録するのは？", "opts": ["入金伝票", "出金伝票", "振替伝票"], "a": 2, "why": "現金の入出金がないため振替伝票。"}, {"q": "先入先出法とは？", "opts": ["新しい商品から先に払い出す", "先に仕入れた商品から先に払い出すと仮定", "毎回平均単価を計算する"], "a": 1, "why": "FIFO。"}, {"q": "移動平均法ではいつ平均単価を更新する？", "opts": ["仕入のたび", "販売のたび", "決算時だけ"], "a": 0, "why": "新たな仕入のたびに平均単価を再計算。"}, {"q": "クレジット販売で後日カード会社から受取る権利は？", "opts": ["売掛金", "クレジット売掛金", "未収収益"], "a": 1, "why": "カード会社等に対する債権としてクレジット売掛金。"}, {"q": "利益100,000円が出ると、他条件一定なら純資産は？", "opts": ["増える", "減る", "変わらない"], "a": 0, "why": "利益は最終的に繰越利益剰余金につながる。"}]};
const KEY="boki3_commute_v2";
let state;
try{state=JSON.parse(localStorage.getItem(KEY))||{done:[],answers:0,correct:0,current:0,studyDates:[]}}catch(e){state={done:[],answers:0,correct:0,current:0,studyDates:[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function markStudy(){const d=new Date().toISOString().slice(0,10);if(!state.studyDates.includes(d)){state.studyDates.push(d);save()}}
const nav=document.getElementById("nav"),host=document.getElementById("lessonHost");
function esc(s){return s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]))}
function stats(){document.getElementById("doneCount").textContent=state.done.length+"/"+DATA.chapters.length;document.getElementById("correctRate").textContent=state.answers?Math.round(state.correct/state.answers*100)+"%":"—";document.getElementById("streak").textContent=state.studyDates.length+"日";let n=DATA.chapters.findIndex((_,i)=>!state.done.includes(i));if(n<0)n=DATA.chapters.length-1;document.getElementById("nextLesson").textContent=String(n+1).padStart(2,"0");document.getElementById("progress").style.width=(state.done.length/DATA.chapters.length*100)+"%"}
function renderNav(){nav.innerHTML="";DATA.chapters.forEach((c,i)=>{let b=document.createElement("button");b.textContent=String(i+1).padStart(2,"0")+" "+c.title;b.className=(i===state.current?"active ":"")+(state.done.includes(i)?"done":"");b.addEventListener("click",()=>showLesson(i));nav.appendChild(b)})}
function showLesson(i){state.current=Math.max(0,Math.min(DATA.chapters.length-1,i));save();markStudy();renderNav();const c=DATA.chapters[state.current];host.innerHTML=`<article class="lesson"><div class="panel"><div class="eyebrow">CHAPTER ${String(state.current+1).padStart(2,"0")}</div><h2>${c.title}</h2><div class="meta">目安 ${c.time} ｜ ${c.summary}</div>${c.body}</div><div class="chapterActions"><button class="btn" id="prev">← 前へ</button><button class="btn ${state.done.includes(state.current)?"":"primary"}" id="done">${state.done.includes(state.current)?"✓ 修了済み":"この章を修了する"}</button><button class="btn" id="next">次へ →</button></div></article>`;document.getElementById("prev").disabled=state.current===0;document.getElementById("next").disabled=state.current===DATA.chapters.length-1;document.getElementById("prev").onclick=()=>showLesson(state.current-1);document.getElementById("next").onclick=()=>showLesson(state.current+1);document.getElementById("done").onclick=()=>{if(!state.done.includes(state.current)){state.done.push(state.current);save();stats();renderNav();document.getElementById("done").textContent="✓ 修了済み";document.getElementById("done").classList.remove("primary")} if(state.current<DATA.chapters.length-1)setTimeout(()=>showLesson(state.current+1),350)};window.scrollTo({top:0,behavior:"smooth"});stats()}
function screens(which){document.getElementById("courseScreen").classList.toggle("active",which==="course");document.getElementById("drillScreen").classList.toggle("active",which==="drill")}
function sample(arr,n){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,n)}
function startDrill(title,lead){markStudy();screens("drill");document.getElementById("drillTitle").textContent=title;document.getElementById("drillLead").textContent=lead;const qs=sample(DATA.questions,10);const dh=document.getElementById("drillHost"),res=document.getElementById("drillResult");res.className="hidden";res.innerHTML="";dh.innerHTML="";let answered=0,score=0;qs.forEach((q,idx)=>{let card=document.createElement("div");card.className="quizCard";card.innerHTML=`<div class="qnum">Q${idx+1} / 10</div><div class="qtext">${esc(q.q)}</div><div class="options"></div><div class="explain"></div>`;const opts=card.querySelector(".options"),ex=card.querySelector(".explain");q.opts.forEach((o,oi)=>{let b=document.createElement("button");b.textContent=o;b.onclick=()=>{if(card.dataset.answered)return;card.dataset.answered="1";answered++;state.answers++;if(oi===q.a){score++;state.correct++;b.classList.add("good");ex.textContent="✓ "+q.why}else{b.classList.add("bad");[...opts.children][q.a].classList.add("good");ex.textContent="× "+q.why}save();stats();if(answered===qs.length){res.className="panel";res.innerHTML=`<div class="scoreBig">${score} / 10</div><p>${score>=9?"かなり良いです。2級接続を意識して進めましょう。":score>=7?"合格圏の土台。間違えた論点だけ復習。":"該当章に戻って理解を固めましょう。"}</p><button class="btn primary" id="retry">もう10問</button>`;document.getElementById("retry").onclick=()=>startDrill(title,lead);res.scrollIntoView({behavior:"smooth",block:"center"})}};opts.appendChild(b)});dh.appendChild(card)});window.scrollTo({top:0,behavior:"smooth"})}
document.getElementById("todayBtn").onclick=()=>{let n=DATA.chapters.findIndex((_,i)=>!state.done.includes(i));if(n<0){startDrill("今日の10分","全章修了済み。今日はランダム10問で定着確認。")}else{state.current=n;save();screens("course");showLesson(n)}};
document.getElementById("courseBtn").onclick=()=>{screens("course");showLesson(state.current)};
document.getElementById("drillBtn").onclick=()=>startDrill("ランダム10問","3級全範囲から10問。通勤の仕上げに。");
document.getElementById("backCourse").onclick=()=>{screens("course");showLesson(state.current)};
renderNav();showLesson(state.current);stats();
</script>
